spring.application.name=url-shortener

# Database connection. Value after ':' is the default.
# Can be changed later with environment variables, no code change needed.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:url_shortener}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Flyway creates the tables. Hibernate only checks they match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migration files location
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

# Health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger UI page
springdoc.swagger-ui.path=/swagger-ui.html

# My app settings
app.shortener.base-url=http://localhost:8080
app.shortener.code-length=7
app.shortener.max-collision-retries=3