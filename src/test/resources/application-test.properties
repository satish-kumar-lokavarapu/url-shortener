# Settings used only when tests run with profile "test".
# Uses H2 (in-memory database) instead of real MySQL.
# H2 runs in MySQL mode, and the same Flyway files create the tables.
# So tests use the same schema but never touch real data.

spring.datasource.url=jdbc:h2:mem:url_shortener;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration